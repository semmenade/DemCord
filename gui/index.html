<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DemCord</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1e1e24;--surface:#26262e;--raised:#2e2e38;--hover:#34343f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --accent:#a855f7;--accent2:#7B2FBE;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --t1:#f0eeff;--t2:#a09ab8;--t3:#5a546e;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overflow:hidden;}
#titlebar{height:38px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;-webkit-app-region:drag;}
#tb-l{display:flex;align-items:center;gap:9px;}
#tb-l svg{flex-shrink:0}
#tb-title{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--t2);text-transform:uppercase;}
#tb-r{-webkit-app-region:no-drag;display:flex;gap:2px;}
.tbtn{width:30px;height:26px;background:transparent;border:none;color:var(--t3);cursor:pointer;border-radius:5px;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .1s;}
.tbtn:hover{background:var(--hover);color:var(--t1);}
.tbtn.x:hover{background:var(--red);color:#fff;}

#wrap{height:calc(100vh - 38px);overflow-y:auto;padding:32px 36px;}

/* Header */
.logo-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.logo-text h1{font-size:26px;font-weight:800;letter-spacing:.5px;}
.logo-text p{font-size:12px;color:var(--t3);margin-top:3px;}
.divider{height:1px;background:var(--border);margin:22px 0;}

/* Info box */
.infobox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:20px;font-size:13px;color:var(--t2);line-height:1.6;}
.infobox .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.infobox .row:last-child{margin-bottom:0;}
.infobox .label{color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.infobox .val{color:var(--t1);font-weight:600;font-size:13px;}
.badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;}
.badge.patched{background:rgba(168,85,247,0.15);color:var(--accent);border:1px solid rgba(168,85,247,0.3);}
.badge.clean{background:rgba(255,255,255,0.05);color:var(--t3);border:1px solid var(--border);}

/* Warning */
.warn{display:none;align-items:center;gap:10px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--amber);margin-bottom:16px;}
.warn.show{display:flex;}
.warn-btns{margin-left:auto;display:flex;gap:6px;}
.wbtn{background:transparent;border:1px solid rgba(245,158,11,0.3);border-radius:5px;color:var(--amber);padding:3px 10px;font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap;}
.wbtn:hover{background:rgba(245,158,11,0.1);}
.wbtn:disabled{opacity:.5;cursor:not-allowed;}

/* Action buttons */
.btn-row{display:flex;gap:8px;margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 0;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;flex:1;transition:opacity .12s,transform .1s;letter-spacing:.3px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.install{background:var(--accent);color:#fff;}
.btn.install:hover:not(:disabled){opacity:.88;}
.btn.repair{background:var(--raised);color:var(--t1);border:1px solid var(--border2);}
.btn.repair:hover:not(:disabled){background:var(--hover);}
.btn.uninstall{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,0.3);}
.btn.uninstall:hover:not(:disabled){background:rgba(239,68,68,0.08);}

/* Log */
.log-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:6px;}
#log{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:Consolas,monospace;font-size:12px;color:var(--t2);min-height:80px;max-height:150px;overflow-y:auto;line-height:1.9;}
.ll{display:flex;gap:8px;}
.lt{color:var(--t3);flex-shrink:0;}
.ll.ok .lm{color:var(--green);}
.ll.err .lm{color:var(--red);}
.ll.info .lm{color:var(--accent);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--hover);border-radius:3px;}
</style>
</head>
<body>

<div id="titlebar">
  <div id="tb-l">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <polygon points="9,1 17,5.5 17,12.5 9,17 1,12.5 1,5.5" stroke="#a855f7" stroke-width="1.5" fill="rgba(168,85,247,0.1)"/>
      <polygon points="9,5 13,7.5 13,10.5 9,13 5,10.5 5,7.5" stroke="#a855f7" stroke-width="1" fill="rgba(168,85,247,0.15)"/>
    </svg>
    <span id="tb-title">DemCord Installer</span>
  </div>
  <div id="tb-r">
    <button class="tbtn" onclick="ipc('minimize')">&#8211;</button>
    <button class="tbtn x" onclick="ipc('close')">&#10005;</button>
  </div>
</div>

<div id="wrap">
  <div class="logo-row">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <polygon points="22,3 41,13 41,31 22,41 3,31 3,13" stroke="#a855f7" stroke-width="2" fill="rgba(168,85,247,0.08)"/>
      <polygon points="22,10 33,16 33,28 22,34 11,28 11,16" stroke="#a855f7" stroke-width="1.5" fill="rgba(168,85,247,0.13)"/>
      <text x="22" y="27" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#a855f7">DC</text>
    </svg>
    <div class="logo-text">
      <h1>DemCord</h1>
      <p>Custom Discord client mod — built from scratch</p>
    </div>
  </div>

  <div class="divider"></div>

  <div id="warn" class="warn">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 2L2 17h16z" stroke="#f59e0b" stroke-width="1.5" fill="none"/><path d="M10 8v4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/></svg>
    Discord is running. Close it before patching.
    <div class="warn-btns">
      <button class="wbtn" id="kill-btn" onclick="killDc()">Force Close</button>
      <button class="wbtn" id="recheck-btn" onclick="recheck()">Re-check</button>
    </div>
  </div>

  <div class="infobox" id="infobox">
    <div style="color:var(--t3);font-size:13px;">Scanning for Discord...</div>
  </div>

  <div class="btn-row">
    <button class="btn install" id="btn-install" onclick="doInstall()" disabled>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v9M4 8l4 5 4-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Install
    </button>
    <button class="btn repair" id="btn-repair" onclick="doRepair()" disabled>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 1 0 1.2-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2 4v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Reinstall / Repair
    </button>
    <button class="btn uninstall" id="btn-uninstall" onclick="doUninstall()" disabled>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V2h4v2M5 4v9h6V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Uninstall
    </button>
  </div>

  <div class="log-label">Log</div>
  <div id="log"></div>
</div>

<script src="renderer.js"></script>
</body>
</html>
